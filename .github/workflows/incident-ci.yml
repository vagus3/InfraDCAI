name: Incident checks

on:
  pull_request:
  push:
    branches: [main, feature/infra]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # The project lives in a subdirectory while the workflows have to sit at the
    # repository root -- GitHub only discovers .github/workflows there. Every
    # `run` step below is relative to the project, not the repo root.
    defaults:
      run:
        working-directory: incident-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r incidentops/requirements.txt
      - name: Compile
        run: python -m compileall -q incidentops decision_monitor app
      - name: Tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q incidentops/tests decision_monitor/tests app/tests
      - name: Check architecture decisions
        env:
          PYTHONPATH: .
        run: python -m decision_monitor.cli repo --root .
